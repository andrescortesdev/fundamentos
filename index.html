<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08111f"><title>Fundamentos de ciberseguridad</title><style>
:root{--b:#08111f;--s:#101d2e;--s2:#15263a;--l:#243b55;--t:#edf6ff;--m:#9ab0c7;--c:#55c7ff;--g:#58e1ad;--o:#ffbe69}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:16px/1.6 system-ui,sans-serif}.app{max-width:760px;margin:auto;padding:0 16px 40px}button{font:inherit;cursor:pointer}.top{position:sticky;top:0;z-index:3;margin:0 -16px;padding:12px 16px;background:#08111fee;border-bottom:1px solid var(--l);backdrop-filter:blur(14px)}.topbar{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center;color:var(--t);text-decoration:none}.mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#12324a;color:var(--c);font-size:22px}.brand strong,.brand small{display:block}.brand strong{font-size:14px}.brand small{font-size:11px;color:var(--m)}.menu,.back{border:0;background:none;color:var(--c);font-weight:700}.menu{border:1px solid var(--l);background:var(--s);padding:9px 12px;border-radius:10px}.hero{padding:38px 4px 25px}.eyebrow{color:var(--g);font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.hero h1{font-size:clamp(30px,9vw,50px);line-height:1.08;margin:10px 0 14px;letter-spacing:-.04em}.hero p,.lesson-header p{color:var(--m);margin:0}.progress-card,.menu-card,.reading-card,.question{background:var(--s);border:1px solid var(--l);border-radius:18px}.progress-card{padding:16px;margin-bottom:24px}.progress-head{display:flex;justify-content:space-between;margin-bottom:10px}.progress-head strong{color:var(--g)}.progress{height:9px;background:#1c344c;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--g))}.menu-card{padding:16px}.menu-card h2{margin:0 0 4px}.menu-card p{color:var(--m);margin:0 0 14px;font-size:14px}.topic-list{display:grid;gap:10px}.topic-link{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--s2);border:1px solid transparent;border-radius:14px;color:var(--t);padding:14px;text-decoration:none}.topic-link.done{border-color:#287a61}.topic-main{display:flex;align-items:center;gap:12px}.topic-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:#1a3851;color:var(--c)}.topic-link b{display:block;font-size:15px}.topic-link small{display:block;color:var(--m);font-size:12px}.arrow{color:var(--m);font-size:22px}.lesson{display:none;padding-top:22px}.lesson.active{display:block}.back{padding:0;margin:0 0 20px}.lesson-header{margin-bottom:20px}.lesson-header h2{font-size:31px;line-height:1.12;margin:6px 0}.reading{display:grid;gap:13px}.reading-card{padding:18px}.reading-card h3{font-size:19px;margin:0 0 8px;color:var(--c)}.reading-card p{margin:0;color:#d6e4f1}.example{border-left:3px solid var(--o);background:#2a2318;padding:12px 14px;border-radius:0 12px 12px 0;color:#ffe1b4;margin-top:12px}.quiz-head{margin:30px 0 14px}.quiz-head h3{margin:0 0 3px;font-size:22px}.quiz-head p{margin:0;color:var(--m);font-size:14px}.question{padding:16px;margin-bottom:11px}.question h4{font-size:15px;line-height:1.4;margin:0 0 12px}.option{display:flex;gap:10px;border:1px solid #29435d;border-radius:11px;padding:11px;margin-top:8px;color:#d9e7f3}.option:has(input:checked){border-color:var(--c);background:#12304a}.option input{accent-color:var(--c);margin-top:5px}.feedback{display:none;margin-top:11px;border-radius:10px;padding:9px 11px;font-size:14px}.feedback.show{display:block}.feedback.ok{background:#123e32;color:#9aefd0}.feedback.no{background:#482532;color:#ffbcc7}.quiz-actions{display:flex;justify-content:space-between;align-items:center;gap:10px}.primary{border:0;border-radius:12px;background:linear-gradient(135deg,#1689c1,#168f75);color:white;font-weight:800;padding:12px 16px}.score{color:var(--m);font-size:14px}.reset{display:block;margin:25px auto 0;background:none;border:0;color:var(--m);text-decoration:underline}@media(min-width:700px){.app{padding:0 24px 60px}.top{margin:0 -24px;padding:12px 24px}.topic-list{grid-template-columns:1fr 1fr}.reading{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><header class="top"><div class="topbar"><a class="brand" href="#" onclick="home()"><span class="mark">⌁</span><span><strong>Ruta segura</strong><small>LFD121 · fundamentos</small></span></a><button class="menu" onclick="home()">☰ Menú</button></div></header><main id="inicio"><section class="hero"><div class="eyebrow">Módulo 01 · Comienza aquí</div><h1>Fundamentos de ciberseguridad</h1><p>Aprende qué debemos proteger, qué puede salir mal y cómo pensar como una persona especialista en seguridad.</p></section><section class="progress-card"><div class="progress-head"><span>Tu progreso</span><strong id="pct">0%</strong></div><div class="progress"><i id="bar"></i></div></section><section class="menu-card"><h2>Fundamentos</h2><p>Lee cada tema y responde sus 5 preguntas.</p><nav class="topic-list" id="list"></nav></section></main><section class="lesson" id="lesson"></section></div><script>
const topics=[['ciberseguridad','◈','¿Qué es la ciberseguridad?','La práctica de proteger sistemas, redes, aplicaciones, dispositivos y datos frente a accesos no autorizados, daños, interrupciones o usos indebidos.',['No es solo antivirus: acompaña todo el ciclo de vida, desde entender qué es importante hasta aplicar controles y aprender de incidentes.','La tríada CIA resume tres metas: confidencialidad (solo accede quien debe), integridad (la información permanece correcta) y disponibilidad (los servicios funcionan cuando se necesitan).','Una aplicación bancaria debe mantener tus datos privados, mostrar saldos correctos y estar disponible para operar.'],['¿Cuál es su propósito?',['Proteger sistemas, datos y servicios','Hacer públicos todos los datos','Eliminar dispositivos'],0],['¿Qué es confidencialidad?',['Datos correctos','Acceso solo autorizado','Sistema encendido'],1],['¿Qué protege la integridad?',['Que los datos no se alteren','Que todos modifiquen','Más memoria'],0],['Disponibilidad significa que…',['El servicio funciona cuando se necesita','Los datos son secretos','El código es abierto'],0],['La seguridad debe considerarse…',['Durante todo el ciclo de vida','Solo tras un ataque','Solo al comprar hardware'],0]],
['activos','▣','Activos','Cualquier recurso que tiene valor para una persona u organización y merece protección.',['Son activos los datos, credenciales, claves, código fuente, bases de datos, servidores, dispositivos, aplicaciones, dinero y reputación.','No todo es digital: una oficina, portátil, contrato impreso o conocimiento también pueden ser activos.','Para priorizar, registra propietario, ubicación, valor, usuarios e impacto de su pérdida o exposición.'],['¿Qué es un activo?',['Un recurso con valor que debe protegerse','Solo un servidor','Una amenaza'],0],['¿Cuál es un activo de información?',['Una contraseña de cliente','Una amenaza','Un parche'],0],['¿Cuál puede ser no digital?',['La reputación empresarial','Una consulta SQL','Un virus'],0],['¿Por qué se identifican?',['Para priorizar su protección','Para hacerlos públicos','Para eliminar controles'],0],['¿Qué ayuda a valorarlo?',['Pensar en el impacto de su pérdida','Su color','El número de botones'],0]],
['amenazas','⚠','Amenazas','Cualquier circunstancia, actor o evento con capacidad de aprovechar una debilidad y causar daño a un activo.',['Puede ser un atacante, empleado malicioso, error humano, fallo técnico, desastre natural o malware.','No toda amenaza es intencional: enviar un correo a la persona equivocada puede exponer datos.','Phishing, ransomware, robo de credenciales, interrupciones y espionaje son ejemplos comunes.'],['¿Qué es una amenaza?',['Algo con capacidad de causar daño','Una debilidad','Un control'],0],['¿Cuál es intencional?',['Un atacante que roba credenciales','Un terremoto','Un fallo de energía'],0],['¿Un error humano puede ser amenaza?',['Sí, aunque no haya mala intención','No nunca','Solo si es virus'],0],['El phishing intenta…',['Engañar para obtener acceso','Mejorar disponibilidad','Actualizar el sistema'],0],['Para analizarla conviene preguntar…',['Quién o qué puede actuar y contra qué activo','Qué color tiene','Cuántas pantallas hay'],0]],
['vulnerabilidades','⌁','Vulnerabilidades','Una debilidad en el diseño, código, configuración, proceso o comportamiento humano que puede ser aprovechada.',['Pueden existir en una validación incompleta, contraseña débil, permiso excesivo, dependencia desactualizada o configuración insegura.','La vulnerabilidad es la debilidad; el ataque es la acción que intenta aprovecharla. Una puerta sin cerradura es la vulnerabilidad.','Se reducen con parches, diseño seguro, controles, pruebas y capacitación.'],['¿Qué describe una vulnerabilidad?',['Una debilidad aprovechable','Un activo','Un ataque completado'],0],['¿Cuál es vulnerabilidad?',['Contraseña predeterminada sin cambiar','Equipo apagado','Alerta resuelta'],0],['La diferencia correcta es…',['La vulnerabilidad es debilidad y el ataque la explota','Son lo mismo','El ataque siempre es accidental'],0],['¿Qué puede reducirla?',['Parches y controles adecuados','Compartir credenciales','Dar permisos máximos'],0],['Una dependencia desactualizada puede ser…',['Una vulnerabilidad potencial','Un activo físico','Una firma'],0]],
['riesgos','△','Riesgos','La posibilidad de que una amenaza aproveche una vulnerabilidad y produzca un impacto sobre un activo.',['Una forma simple: activo + amenaza + vulnerabilidad + impacto = escenario de riesgo.','Para priorizar se consideran probabilidad e impacto. Un riesgo puede ser poco probable pero devastador.','Ejemplo: una base de datos con datos personales, un atacante y una contraseña débil pueden terminar en exposición de información.'],['¿Qué es riesgo?',['Amenaza que aprovecha debilidad y causa impacto','Una contraseña fuerte','Un activo sin valor'],0],['Para priorizar se considera…',['Probabilidad e impacto','Color de la alerta','Marca del servidor'],0],['Una contraseña débil es…',['La vulnerabilidad','El activo','El impacto'],0],['La exposición de datos representa…',['El impacto','La amenaza','El parche'],0],['¿Qué atender primero?',['Alta probabilidad y alto impacto','Uno al azar','Uno sin activo afectado'],0]]];
let st=JSON.parse(localStorage.getItem('fundamentos-mobile')||'null')||{done:{},ans:{}};const save=()=>localStorage.setItem('fundamentos-mobile',JSON.stringify(st));
function menu(){list.innerHTML=topics.map(t=>`<a class="topic-link ${st.done[t[0]]?'done':''}" href="#${t[0]}" onclick="openTopic('${t[0]}')"><span class="topic-main"><span class="topic-icon">${t[1]}</span><span><b>${st.done[t[0]]?'✓ ':''}${t[2]}</b><small>Lectura · 5 preguntas</small></span></span><span class="arrow">›</span></a>`).join('');let n=Object.keys(st.done).length,p=Math.round(n/topics.length*100);pct.textContent=p+'%';bar.style.width=p+'%'}
function home(){inicio.style.display='block';lesson.classList.remove('active');menu();scrollTo(0,0)}
function openTopic(id){let t=topics.find(x=>x[0]===id);inicio.style.display='none';lesson.classList.add('active');lesson.innerHTML=`<button class="back" onclick="home()">‹ Volver a fundamentos</button><header class="lesson-header"><div class="eyebrow">Lectura guiada</div><h2>${t[1]} ${t[2]}</h2><p>${t[3]}</p></header><div class="reading">${t[4].map((x,i)=>`<article class="reading-card"><h3>${i+1}. ${['La idea principal','Cómo reconocerlo','Ejemplo práctico'][i]}</h3><p>${x}</p>${i===2?'<div class="example"><b>Idea clave:</b> identifica qué tiene valor, qué puede ocurrir y qué debilidad lo permite.</div>':''}</article>`).join('')}</div><div class="quiz-head"><h3>Comprueba lo aprendido</h3><p>Responde las 5 preguntas; verás el resultado al comprobar.</p></div><div id="quiz">${t.slice(5).map((q,i)=>{let a=st.ans[id+i];return `<article class="question"><h4>${i+1}. ${q[0]}</h4>${q[1].map((o,k)=>`<label class="option"><input type="radio" name="q${i}" value="${k}" ${a&&a.c===k?'checked':''} ${a?'disabled':''}>${o}</label>`).join('')}<div class="feedback ${a?'show '+(a.ok?'ok':'no'):''}">${a?(a.ok?'✓ Correcto.':'✗ Incorrecto. Repasa la lectura e inténtalo de nuevo.'):''}</div></article>`}).join('')}</div><div class="quiz-actions"><span class="score">Puntuación: ${score(t)}/5</span><button class="primary" onclick="check('${id}')">Comprobar respuestas</button></div><button class="reset" onclick="resetTopic('${id}')">Reiniciar este tema</button>`;scrollTo(0,0)}
function score(t){return t.slice(5).reduce((n,q,i)=>n+(st.ans[t[0]+i]?.ok?1:0),0)}function check(id){let t=topics.find(x=>x[0]===id);t.slice(5).forEach((q,i)=>{if(st.ans[id+i])return;let e=document.querySelector(`input[name=q${i}]:checked`);if(e)st.ans[id+i]={c:+e.value,ok:+e.value===q[2]}});if(t.slice(5).every((_,i)=>st.ans[id+i]))st.done[id]=score(t)===5;save();openTopic(id)}function resetTopic(id){topics.find(t=>t[0]===id).slice(5).forEach((_,i)=>delete st.ans[id+i]);delete st.done[id];save();openTopic(id)}menu();
</script></body></html>
